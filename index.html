<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เกมประวัติศาสตร์ ร.๕ (AR Hand & Head Tracking)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- เปลี่ยนจาก MediaPipe Hands มาใช้ MediaPipe Pose เพื่อจับทั้งหัวและมือ -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    
    <style>
        body {
            font-family: 'Sarabun', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #2c1e16;
            background-image: url('https://www.transparenttextures.com/patterns/aged-paper.png');
            color: #3e2723;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 1280px;
            max-height: 720px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            background-color: #f4e4bc;
            border: 8px solid #8b6508;
            border-radius: 12px;
            overflow: hidden;
        }

        #game-canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* ซ่อนกล้องไปเลย เพราะเราจะวาดกล้องลงบน Canvas โดยตรง */
        #webcam-video {
            display: none; 
        }

        #status-message {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 14px;
            z-index: 20;
            display: none;
        }
        
        #error-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            color: red;

<body>

<div id="game-container">
    <canvas id="game-canvas"></canvas>
    <video id="webcam-video" autoplay playsinline></video>
    <div id="status-message">กำลังโหลดระบบ AI Tracking...</div>

    function checkHover() {
        if (currentState === STATE_AR_GAME) {
            hoverTarget = null;
            return;
        }

        const found = findButtonAt(cursorX, cursorY);
        const useDwell = (gameMode === 'AR' && cameraStarted && isPersonPresent);

        if (!useDwell) {
            hoverTarget = found;
            hoverStartTime = 0;
            return;
        }

        if (found) {
            if (hoverTarget && hoverTarget.id === found.id) {
                if (Date.now() - hoverStartTime >= HOVER_DURATION) {
                    hoverTarget = null;
                    hoverStartTime = 0;
                    if (found.id !== 'btn_mute') sfxClick();
                    found.action();
                }
            } else {
                hoverTarget = found;
                hoverStartTime = Date.now();
            }

    function drawText(text, x, y, size, color, align = 'center', weight = 'normal', outline = false) {
        ctx.font = `${weight} ${size}px 'Sarabun', sans-serif`;
        ctx.textAlign = align;
        ctx.textBaseline = 'alphabetic'; // ต้องตั้งทุกครั้ง เพราะการวาดอิโมจิตั้งค่าเป็น 'middle' ค้างไว้
        if(outline) {
            ctx.lineWidth = 4;
            ctx.strokeStyle = '#000';
            ctx.strokeText(text, x, y);
        }
        ctx.fillStyle = color;
        ctx.fillText(text, x, y);
    }

    // ตัดข้อความยาวให้เป็นหลายบรรทัด (สูงสุดตามที่กำหนด) โดยพยายามให้แต่ละบรรทัดยาวใกล้เคียงกัน
    // ภาษาไทยไม่มีช่องว่างระหว่างคำเสมอ จึงตัดที่ช่องว่างก่อน ถ้าไม่มีช่องว่างจึงตัดตามตัวอักษร
    const _wrapCache = new Map(); // กันการวัดความกว้างซ้ำทุกเฟรม

    function wrapText(text, maxWidth, fontSize, maxLines = 2) {
        const key = `${text}|${maxWidth}|${fontSize}|${maxLines}`;
        if (_wrapCache.has(key)) return _wrapCache.get(key);

        ctx.font = `bold ${fontSize}px 'Sarabun', sans-serif`;
        const width = (s) => ctx.measureText(s).width;
        let result;

        if (width(text) <= maxWidth) {
            result = [text];
        } else {
            // ตั้งเป้าให้แต่ละบรรทัดยาวใกล้เคียงกัน (ข้อความไทยมักไม่มีช่องว่างระหว่างคำ
            // จึงตัดทีละตัวอักษรได้ แต่จะเลือกตัดตรงช่องว่างถ้ามีอยู่ใกล้ๆ)
            const lineCount = Math.min(maxLines, Math.ceil(width(text) / maxWidth));
            const target = width(text) / lineCount;

            let lines = [];
            let rest = text;

            for (let n = 0; n < lineCount && rest.length; n++) {
                if (n === lineCount - 1) { lines.push(rest); rest = ''; break; }

                let cut = 0;
                while (cut < rest.length) {
                    const w = width(rest.slice(0, cut + 1));
                    if (w > maxWidth) break;
                    cut++;
                    if (w >= target) break;
                }

                // ถ้ามีช่องว่างใกล้จุดตัด ให้ตัดตรงช่องว่างแทนเพื่อไม่ให้คำขาดกลาง
                const spaceAt = rest.lastIndexOf(' ', cut);
                if (spaceAt > cut - 12 && spaceAt > 0) {
                    cut = spaceAt;
                } else {
                    // เลี่ยงการตัดหน้าสระบน/ล่าง หรือวรรณยุกต์ ซึ่งจะทำให้ขึ้นบรรทัดใหม่ด้วยสระลอยๆ
                    const THAI_COMBINING = /[\u0E31\u0E34-\u0E3A\u0E47-\u0E4E]/;
                    let guard = 0;
                    while (cut > 1 && guard++ < 8 && THAI_COMBINING.test(rest.charAt(cut))) {
                        cut--;
                    }
                }

                lines.push(rest.slice(0, cut).trim());
                rest = rest.slice(cut).trim();
            }

            // บรรทัดสุดท้ายถ้ายังล้น ให้ตัดแล้วเติม …
            let last = lines[lines.length - 1];
            if (width(last) > maxWidth) {
                while (last.length > 1 && width(last + '…') > maxWidth) last = last.slice(0, -1);
                lines[lines.length - 1] = last + '…';
            }
            result = lines.filter(l => l.length);
        }

        _wrapCache.set(key, result);
        return result;
    }

    function drawRoundedRect(x, y, w, h, radius, fillStyle, strokeStyle, strokeWidth = 2) {
        ctx.beginPath();
        ctx.moveTo(x + radius, y);
        ctx.lineTo(x + w - radius, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + radius);
        ctx.lineTo(x + w, y + h - radius);
        ctx.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
        ctx.lineTo(x + radius, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - radius);
        ctx.lineTo(x, y + radius);
        ctx.quadraticCurveTo(x, y, x + radius, y);
        ctx.closePath();
        
        if (fillStyle) {
            ctx.fillStyle = fillStyle;
            ctx.fill();
        }
        if (strokeStyle) {
            ctx.lineWidth = strokeWidth;
            ctx.strokeStyle = strokeStyle;
            ctx.stroke();
        }
    }

    function drawScene() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        buttons = [];

        if (currentState === STATE_AR_GAME) {
            drawARGameScreen();
        } else {
            const arMenu = (gameMode === 'AR' && cameraStarted);

            if (arMenu) {

                ctx.save();
                ctx.translate(canvas.width, 0);
                ctx.scale(-1, 1);
                try { ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height); } catch(e) {}
                ctx.restore();
                // ม่านทึบเพื่อให้ตัวหนังสือเมนูอ่านออก
                ctx.fillStyle = 'rgba(30, 18, 6, 0.55)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            } else {
                // Draw Vintage Background for Menus
                ctx.fillStyle = '#f4e4bc';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
            ctx.lineWidth = 4;
            ctx.strokeStyle = '#cda434';
            ctx.strokeRect(20, 20, canvas.width - 40, canvas.height - 40);

                drawStartScreen();

    function drawMuteButton() {

    let showRules = false;

    // ปุ่มเล็กมุมขวาบนของหน้าเมนู
    // ===== ระบบเสียง =====
    // สร้างเสียงด้วย Web Audio API ทั้งหมด ไม่ต้องโหลดไฟล์เสียงจากภายนอก
    // จึงใช้งานได้แม้เน็ตโรงเรียนช้าหรือเปิดไฟล์แบบออฟไลน์
    let audioCtx = null;
    let audioMuted = false;
    let musicTimer = null;
    let musicStep = 0;

    function ensureAudio() {
        if (audioCtx) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }
        try {
            const AC = window.AudioContext || window.webkitAudioContext;
            if (!AC) return null;
            audioCtx = new AC();
            return audioCtx;
        } catch (e) {
            return null; // เบราว์เซอร์ไม่รองรับ ก็เล่นเกมต่อได้ตามปกติ
        }
    }

    function playTone(freq, dur, type = 'sine', vol = 0.18, delay = 0) {
        if (audioMuted) return;
        const ac = ensureAudio();
        if (!ac) return;
        try {
            const t0 = ac.currentTime + delay;
            const osc = ac.createOscillator();
            const gain = ac.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, t0);
            gain.gain.setValueAtTime(0.0001, t0);
            gain.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
            osc.connect(gain);
            gain.connect(ac.destination);
            osc.start(t0);
            osc.stop(t0 + dur + 0.05);
        } catch (e) { /* ข้ามไปถ้าเล่นเสียงไม่ได้ */ }
    }

    // สลับลำดับอาร์เรย์แบบ Fisher-Yates โดยไม่แก้ต้นฉบับ (คืนอาร์เรย์ใหม่เสมอ)
    function shuffleArray(arr) {
        let a = [...arr];
        for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
    }

    function initARGame() {
        currentState = STATE_AR_GAME;
        startMusic();
        arScore = 0;
        currentArQuestion = 0;

        // ดึงคลังโจทย์ของภารกิจนี้ (ถ้าไม่มีข้อมูลจริง ใช้ภารกิจแรกแทน)
        let pool = gameDatabase[selectedMission] || gameDatabase[0];

        // แยกโจทย์ที่ "เกี่ยวข้อง" กับหมวกที่เลือก ออกจากโจทย์อื่นๆ ในภารกิจเดียวกัน ("ไม่เกี่ยวข้อง")
        let related = shuffleArray(pool.filter(q => q.hats.includes(selectedHat)));
        let unrelated = shuffleArray(pool.filter(q => !q.hats.includes(selectedHat)));

        // การันตีว่ามีโจทย์ที่เกี่ยวข้องอย่างน้อย (สูงสุด 3 ข้อ) แล้วเติมโจทย์ไม่เกี่ยวข้องให้ครบ 5 ข้อ
        // เพื่อป้องกันไม่ให้รอบใดรอบหนึ่งกลายเป็น "หลบอย่างเดียว" ทั้ง 5 ข้อ
        let pickedRelated = related.slice(0, 3);
        let pickedUnrelated = unrelated.slice(0, 5 - pickedRelated.length);

        arQuestions = shuffleArray([...pickedRelated, ...pickedUnrelated]);

        startARQuestion(currentArQuestion);
    }

    function startARQuestion(index) {
        if(index >= arQuestions.length) {
            stopMusic();
            currentState = STATE_SUMMARY;
            return;
        }
        
        let q = arQuestions[index];
        arIsCurrentQuestionRelated = q.hats.includes(selectedHat);
        arRocks = [];
        arRocksCollected = 0;
        cartX = CANVAS_WIDTH / 2; // รีเซ็ตรถเข็นกลับกลางจอทุกข้อ
        
        arSubState = "READY";
        arStateTimer = Date.now(); // ให้เวลาอ่านโจทย์ 5 วินาทีก่อนหินเริ่มตก
    }

    // วาดกล่องโจทย์ด้านบน รองรับข้อความยาวโดยตัดเป็น 2 บรรทัด
    // คำนวณความสูงกล่องจากจำนวนบรรทัดจริง เพื่อให้ข้อความอยู่ในกรอบพอดีเสมอ
    function drawQuestionBox(q, h) {
        const boxX = 100, boxY = 20, boxW = CANVAS_WIDTH - 200;
        const padTop = 14, padBottom = 18;
        const headSize = 24, headGap = 14;
        const fontSize = 34, lineGap = 10;
        const lineHeight = fontSize + lineGap;

        const lines = wrapText(`โจทย์: "${q.text}"`, boxW - 60, fontSize, 2);
        const boxH = padTop + headSize + headGap + lines.length * lineHeight + padBottom;

        drawRoundedRect(boxX, boxY, boxW, boxH, 20, 'rgba(255,255,255,0.92)', h.color, 4);

        // baseline ของหัวข้อ = ขอบบน + padding + ความสูงตัวอักษร
        const headBaseline = boxY + padTop + headSize;
        drawText(`ข้อที่ ${currentArQuestion+1}/${arQuestions.length} | ${h.name} (${h.label})`,
                 CANVAS_WIDTH/2, headBaseline, headSize, h.color, 'center', 'bold');

        // baseline บรรทัดแรกของโจทย์ เว้นจากหัวข้อลงมา แล้วไล่ทีละ lineHeight
        const firstBaseline = headBaseline + headGap + fontSize;
        for (let i = 0; i < lines.length; i++) {
            drawText(lines[i], CANVAS_WIDTH/2, firstBaseline + i * lineHeight, fontSize, '#333', 'center', 'bold');
        }
        return boxY + boxH;
    }

    function drawARGameScreen() {
        if (gameMode === 'AR') {
            // 1. พื้นหลังภาพจากกล้อง (กลับด้านซ้าย-ขวาให้เหมือนส่องกระจก)
            ctx.save();
            ctx.translate(canvas.width, 0);
            ctx.scale(-1, 1);
            ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);
            ctx.restore();

            // 2. เอฟเฟกต์ภาพเก่า
            ctx.fillStyle = 'rgba(139, 101, 8, 0.2)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        } else {
            // โหมดปกติ: พื้นหลังวาดเอง ไม่ใช้กล้อง
            let grd = ctx.createLinearGradient(0, 0, 0, CANVAS_HEIGHT);
            grd.addColorStop(0, '#d8c49a');
            grd.addColorStop(1, '#f4e4bc');
            ctx.fillStyle = grd;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // พื้นดิน
            ctx.fillStyle = '#a1887f';
            ctx.fillRect(0, CANVAS_HEIGHT - 60, CANVAS_WIDTH, 60);
        }

        // 3. วาดตัวผู้เล่น (มือ/หัว หรือ รถเข็น) เฉพาะตอนกำลังเล่น
        if (arSubState === "PLAYING") {
            if (gameMode === 'AR') {
                if (isPersonPresent) {
                    drawHitbox(headPos, '😎', 60);
                    drawHitbox(leftHandPos, '✋', 50);
                    drawHitbox(rightHandPos, '✋', 50);
                }
            } else {
                updateCartPosition();
                drawCart();
            }
        } else if (gameMode === 'NORMAL') {
            drawCart(); // ให้เห็นรถเข็นตั้งแต่ตอนอ่านโจทย์
        }

        let q = arQuestions[currentArQuestion];
        let h = hats[selectedHat];

        // 4. กล่องโจทย์ด้านบน (แสดงตลอด รวมถึงช่วงอ่านโจทย์)
        drawQuestionBox(q, h);

        // State Machine
        let now = Date.now();
        if (arSubState === "READY") {
            let elapsed = now - arStateTimer;
            let remain = Math.ceil((READY_DURATION - elapsed) / 1000);

            // ม่านดำบางๆ เฉพาะครึ่งล่าง เพื่อให้ยังอ่านโจทย์ด้านบนได้ชัด
            ctx.fillStyle = 'rgba(0,0,0,0.55)';
            ctx.fillRect(0, 230, canvas.width, canvas.height - 230);

            // ไม่อธิบายกติกาซ้ำตรงนี้แล้ว (ดูได้จากปุ่ม "ดูกติกา" ในหน้าเมนู)
            // เหลือแค่โจทย์ด้านบนกับข้อความเตรียมตัว เพื่อไม่ให้จอรก
            drawText("อ่านโจทย์ให้ดี แล้วเตรียมตัว!", CANVAS_WIDTH/2, 400, 54, '#FFF', 'center', 'bold');

            // นับถอยหลังตัวใหญ่
            drawText(`${Math.max(remain, 1)}`, CANVAS_WIDTH/2, 560, 110, '#F1C40F', 'center', 'bold', true);

            if (elapsed > READY_DURATION) {
                arSubState = "PLAYING";
                arStateTimer = Date.now();
            }
        } 
        else if (arSubState === "PLAYING") {
            // หยุดเกมชั่วคราวเมื่อโหมด AR มองไม่เห็นผู้เล่น
            const paused = (gameMode === 'AR' && !isPersonPresent);

            if (paused) {
                // เลื่อนเวลาเริ่มต้นไปตามเวลาจริงที่ผ่านไป = เวลาที่นับค้างไว้ "หยุดนิ่ง" สนิท
                // (ของเดิมบวกทีละ 16 มิลลิวินาทีต่อเฟรม ซึ่งไม่ตรงกับเวลาจริง เวลาจึงยังเดินอยู่)
                if (arPauseLastTick) arStateTimer += (now - arPauseLastTick);
                arPauseLastTick = now;
            } else {
                arPauseLastTick = 0;
            }

            updateAndDrawRocks(paused);

            if (paused) {
                drawText("⏸ หยุดเวลาชั่วคราว", CANVAS_WIDTH/2, CANVAS_HEIGHT - 215, 32, '#F1C40F', 'center', 'bold', true);
                drawText("⚠️ กลับเข้ามาในกล้องด้วย!", CANVAS_WIDTH/2, CANVAS_HEIGHT - 160, 40, '#E74C3C', 'center', 'bold', true);
            } else {
                checkARWinLoss(now);
            }
        }
        else if (arSubState === "RESULT") {
            let elapsed = now - arStateTimer;
            drawText(arFeedbackText, CANVAS_WIDTH/2, CANVAS_HEIGHT/2, 54, arFeedbackColor, 'center', 'bold', true);
            if(elapsed > 2000) {
                currentArQuestion++;
                startARQuestion(currentArQuestion);
            }
        }

        // ปุ่มออกจากภารกิจ (กดได้ทุกช่วง)
        drawQuitButton();
    }

    // ปุ่มออกกลางเกม - ใช้ hit-test ของตัวเองเพราะช่วง AR_GAME ไม่ได้ลงทะเบียนปุ่มปกติ
    let quitBtnRect = { x: CANVAS_WIDTH - 200, y: CANVAS_HEIGHT - 70, w: 170, h: 50 };
    function drawQuitButton() {
        let r = quitBtnRect;
        drawRoundedRect(r.x, r.y, r.w, r.h, 25, 'rgba(120,20,20,0.85)', '#fff', 2);
        drawText("✕ ออกจากภารกิจ", r.x + r.w/2, r.y + 33, 20, '#fff', 'center', 'bold');
    }

    function updateCartPosition() {
        if (keysPressed['ArrowLeft']) cartX -= CART_SPEED;
        if (keysPressed['ArrowRight']) cartX += CART_SPEED;
        cartX = Math.max(CART_HALF_WIDTH, Math.min(CANVAS_WIDTH - CART_HALF_WIDTH, cartX));
    }

    function drawCart() {
        const y = CANVAS_HEIGHT - 95;
        ctx.font = '80px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('🛒', cartX, y);
        // คนเข็นอยู่ด้านหลังรถ
        ctx.font = '55px Arial';
        ctx.fillText('🧍', cartX - 60, y + 8);
    }

    function drawHitbox(pos, emoji, size) {
        if(!pos.active) return;
        ctx.font = `${size}px Arial`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(emoji, pos.x, pos.y);
    }

    function updateAndDrawRocks(paused = false) {
        let now = Date.now();
        let elapsedSec = (now - arStateTimer) / 1000;
        arGameTimer = Math.max(0, 15 - elapsedSec);

        // Draw Timer and Collection Status (Neutral Display)
        drawText(`เวลา: ${arGameTimer.toFixed(1)} วิ`, 150, 160, 36, '#FFF', 'left', 'bold', true);
        drawText(`เก็บหิน: ${arRocksCollected}`, CANVAS_WIDTH - 150, 160, 36, '#FFF', 'right', 'bold', true);

        // ขณะหยุดชั่วคราว: วาดหินค้างไว้เฉยๆ ไม่ตก ไม่เกิดใหม่ ไม่ตรวจการชน
        if (paused) {
            for (let r of arRocks) {
                if (!r.active) continue;
                ctx.font = '50px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('🪨', r.x, r.y);
            }
            return;
        }

        // คุมให้มีหินตกลงมาทีละ 1-2 ก้อนบนหน้าจอ
        let activeRocks = arRocks.filter(r => r.active).length;
        if (activeRocks < 2 && Math.random() < 0.03) { 
            arRocks.push({
                x: Math.random() * (CANVAS_WIDTH - 100) + 50,
                y: -50,
                radius: 35,
                speed: 3 + Math.random() * 2, // หินตกด้วยความเร็วพอดีๆ
                active: true
            });
            sfxRockSpawn(); // เสียงเบาๆ บอกว่ามีหินก้อนใหม่ร่วงลงมา
        }

        // Update & Draw Rocks
        for(let i=0; i<arRocks.length; i++) {
            let r = arRocks[i];
            if(!r.active) continue;

            r.y += r.speed;
            
            // Draw Rock Emoji
            ctx.font = '50px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('🪨', r.x, r.y);

            // ตรวจการชน: โหมด AR ใช้หัว/มือ, โหมดปกติใช้ปากรถเข็น
            let hit = false;
            if (gameMode === 'AR') {
                if (isPersonPresent) {
                    hit = checkCollision(r, headPos, 35) ||
                          checkCollision(r, leftHandPos, 30) ||
                          checkCollision(r, rightHandPos, 30);
                }
            } else {
                // รถเข็น: กล่องสี่เหลี่ยมบริเวณปากรถ
                const cartTop = CANVAS_HEIGHT - 130;
                const cartBottom = CANVAS_HEIGHT - 60;
                hit = (r.y + r.radius >= cartTop) && (r.y - r.radius <= cartBottom) &&
                      (Math.abs(r.x - cartX) <= CART_HALF_WIDTH + r.radius * 0.5);
            }

            if (hit) {
                r.active = false;
                arRocksCollected++;

                // ถ้าโจทย์ไม่เกี่ยวกับหมวก (ต้องหลบ) แล้วโดนหิน = แพ้ทันที
                if(!arIsCurrentQuestionRelated) {
                    sfxWrong();
                    endARRound(false, "❌ รับหินผิด! โจทย์นี้ไม่เกี่ยวกับหมวกของคุณ จึงต้องหลบ");
                    return;
                }
                sfxCollect();
            }

            if(r.y > CANVAS_HEIGHT + 50) r.active = false;
        }
    }

    function checkCollision(rock, bodyPart, partRadius) {
        if(!bodyPart.active) return false;
        let dx = rock.x - bodyPart.x;
        let dy = rock.y - bodyPart.y;
        let distance = Math.sqrt(dx*dx + dy*dy);
        return distance < (rock.radius + partRadius);
    }

    function checkARWinLoss(now) {
        if (arSubState !== "PLAYING") return;

        // หมายเหตุ: กรณีไม่มีผู้เล่นในเฟรม (โหมด AR) ถูกจัดการเป็น "หยุดเวลา" ใน drawARGameScreen แล้ว
        // และหยุดเหมือนกันทุกข้อ เพื่อไม่ให้เดาได้ว่าข้อไหนเป็นข้อหลบ
        let elapsedSec = (now - arStateTimer) / 1000;

        if (arIsCurrentQuestionRelated) {
            // ต้องเก็บหินให้ครบ 5 ก้อน
            if (arRocksCollected >= 5) {
                endARRound(true, "✅ ยอดเยี่ยม! เก็บครบ 5 ก้อน");
            } else if (elapsedSec >= 15) {
                endARRound(false, "❌ หมดเวลา! เก็บหินไม่ครบ 5 ก้อน");
            }
        } else {
            // ต้องหลบให้ครบ 15 วินาที (เงื่อนไขแพ้ถูกเช็กในลูปหินแล้ว)
            if (elapsedSec >= 15) {
                endARRound(true, "✅ รอดพ้น! คุณวิเคราะห์ถูกว่าต้องหลบ");
            }
        }
    }

    function endARRound(isWin, msg) {
        if(isWin) arScore++;
        arFeedbackText = msg;
        arFeedbackColor = isWin ? '#2ECC71' : '#E74C3C';
        arSubState = "RESULT";
        arStateTimer = Date.now();
        // เสียงสรุปผลของข้อนั้น (เสียงตอนรับหินผิดเล่นไปแล้วก่อนเรียกฟังก์ชันนี้)
        if (isWin) sfxWin(); else sfxLose();
    }

    function drawSummaryScreen() {
        drawText("สรุปผลการวิเคราะห์", CANVAS_WIDTH/2, 200, 60, '#800000', 'center', 'bold');
        
        let resultColor = arScore >= 3 ? '#2ECC71' : '#E74C3C';
        drawText(`คุณทำคะแนนได้: ${arScore} / 5 ข้อ`, CANVAS_WIDTH/2, 350, 48, resultColor, 'center', 'bold');
        
        let feedback = arScore >= 4 ? "สุดยอด! คุณแยกแยะข้อมูลประวัติศาสตร์ได้แม่นยำมาก" 
                     : arScore >= 3 ? "เก่งมาก! ฝึกอีกนิดจะวิเคราะห์ได้เฉียบขาด" 
                     : "พยายามเข้านะ! ลองทบทวนมุมมองของหมวกสีนี้ดูอีกครั้ง";
        drawText(feedback, CANVAS_WIDTH/2, 450, 32, '#333', 'center');

        // ปุ่มเล่นต่อ
        // ในโหมด AR ปุ่มกลับ/กติกาจะไปอยู่แถวล่าง จึงต้องยกปุ่มชุดนี้ขึ้นเพื่อไม่ให้ทับกัน
        const arLayout = (gameMode === 'AR' && cameraStarted);
        let bw = 320, bh = 80, gap = 40, by = arLayout ? 470 : 550;
        let bx1 = CANVAS_WIDTH/2 - bw - gap/2;
        let bx2 = CANVAS_WIDTH/2 + gap/2;

        let hov1 = hoverTarget && hoverTarget.id === 'btn_summary_back';
        drawRoundedRect(bx1, by, bw, bh, 40, hov1 ? '#444' : '#666', '#fff', 3);
        drawText("กลับไปเลือกหมวกใบอื่น", bx1 + bw/2, by + 50, 26, '#FFF', 'center', 'bold');
        registerButton('btn_summary_back', bx1, by, bw, bh, () => {
            currentState = STATE_HATS;
        });

        let hov2 = hoverTarget && hoverTarget.id === 'btn_summary_mode';
        drawRoundedRect(bx2, by, bw, bh, 40, hov2 ? '#6b0000' : '#800000', '#d4af37', 3);
        drawText("เปลี่ยนรูปแบบการเล่น", bx2 + bw/2, by + 50, 26, '#FFF', 'center', 'bold');
        registerButton('btn_summary_mode', bx2, by, bw, bh, () => {
            currentState = STATE_MODE_SELECT;
        });
    }

    function drawBackButton(targetState) {
        // โหมด AR เลือกด้วยหัว จึงทำปุ่มให้ใหญ่และอยู่ในระยะที่เอื้อมถึงง่าย
        const ar = (gameMode === 'AR' && cameraStarted);
        let bw = ar ? 280 : 200, bh = ar ? 80 : 60;
        let bx = 40, by = ar ? CANVAS_HEIGHT - bh - 40 : 40;
        let isHovered = hoverTarget && hoverTarget.id === 'btn_back';
        drawRoundedRect(bx, by, bw, bh, 30, isHovered ? '#555' : '#777', '#333', 2);
        drawText("◀ กลับ", bx + bw/2, by + bh/2 + 10, ar ? 34 : 24, '#fff', 'center', 'bold');
        registerButton('btn_back', bx, by, bw, bh, () => { currentState = targetState; });
    }

    let cameraStarted = false;
    let poseInstance = null;
    let cameraInstance = null;

    function initMediaPipe() {
        if (cameraStarted) return;
        cameraStarted = true;
        
        statusMsg.style.display = 'block';

        // สร้าง Pose ครั้งเดียวแล้วใช้ซ้ำ ป้องกันการโหลดโมเดลใหม่ทุกครั้งที่สลับโหมด
        if (!poseInstance) {
            poseInstance = new Pose({locateFile: (file) => {
                return `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`;
            }});
            poseInstance.setOptions({
                modelComplexity: 1,
                smoothLandmarks: true,
                minDetectionConfidence: 0.7,
                minTrackingConfidence: 0.7
            });
            poseInstance.onResults(onPoseResults);
        }

        if (!cameraInstance) {
            cameraInstance = new Camera(videoElement, {
                onFrame: async () => {
                    // ไม่ต้องประมวลผลถ้าไม่ได้อยู่ในโหมด AR
                    if (gameMode !== 'AR' || !cameraStarted) return;
                    await poseInstance.send({image: videoElement});
                },
                width: 640,
                height: 480
            });
        }

        cameraInstance.start().then(() => {
            statusMsg.style.display = 'none';
        }).catch((err) => {
            console.error(err);
            errorOverlay.style.display = 'flex';
        });
    }

    // ปิดกล้องให้สนิทเมื่อเลือกโหมดเล่นปกติ
    // เพื่อไม่ให้มีการ tracking เหลือค้าง และไฟกล้องดับจริง
    function stopMediaPipe() {
        cameraStarted = false;
        isPersonPresent = false;
        headPos.active = leftHandPos.active = rightHandPos.active = false;
        cursorX = -100; cursorY = -100;
        statusMsg.style.display = 'none';

        try {
            if (cameraInstance) cameraInstance.stop();
        } catch (e) { /* บางเวอร์ชันไม่มี stop() */ }

        // ปิด track ของกล้องเพื่อให้ไฟกล้องดับ
        const stream = videoElement.srcObject;
        if (stream && stream.getTracks) {
            stream.getTracks().forEach(t => t.stop());
            videoElement.srcObject = null;
        }
        cameraInstance = null; // สร้างใหม่เมื่อกลับเข้าโหมด AR อีกครั้ง
    }

    function onPoseResults(results) {
        // กันผลลัพธ์ที่ค้างในคิวมาขยับเคอร์เซอร์ตอนอยู่โหมดเล่นปกติ
        if (gameMode !== 'AR' || !cameraStarted) {
            isPersonPresent = false;
            return;
        }

        if (results.poseLandmarks) {
            isPersonPresent = true;
            let lm = results.poseLandmarks;
            
            // Note: Camera is mirrored via CSS scaleX(-1), so x coordinates need to be inverted (1 - x)
            // Landmark 0: Nose (Head)
            // Landmark 19: Left Index (Appears on left of screen)
            // Landmark 20: Right Index (Appears on right of screen)
            
            headPos = { x: (1 - lm[0].x) * CANVAS_WIDTH, y: lm[0].y * CANVAS_HEIGHT, active: lm[0].visibility > 0.6 };
            leftHandPos = { x: (1 - lm[19].x) * CANVAS_WIDTH, y: lm[19].y * CANVAS_HEIGHT, active: lm[19].visibility > 0.6 };
            rightHandPos = { x: (1 - lm[20].x) * CANVAS_WIDTH, y: lm[20].y * CANVAS_HEIGHT, active: lm[20].visibility > 0.6 };

            // เคอร์เซอร์เมนูใช้ "หัว" (landmark จมูก) เป็นหลัก
            // เพราะ landmark นิ้วชี้ของ MediaPipe Pose มักมีค่า visibility ต่ำและสั่น
            // การใช้หัวจึงนิ่งกว่าและตรงกับคำแนะนำบนจอว่า "เลือกโดยการขยับหัว"
            let px, py;
            if (headPos.active) {
                px = headPos.x; py = headPos.y;
            } else if (rightHandPos.active) {
                px = rightHandPos.x; py = rightHandPos.y;
            } else if (leftHandPos.active) {
                px = leftHandPos.x; py = leftHandPos.y;
            }

            if (px !== undefined) {
                // ขยายระยะการขยับ: หัวขยับได้ในกรอบแคบ ถ้าจับคู่ 1:1 จะเอื้อมไปมุมจอไม่ถึง
                // จึงคูณระยะห่างจากจุดกึ่งกลางให้ไกลขึ้น ปุ่มมุมจอจะเลือกได้ง่ายขึ้นมาก
                const NEUTRAL_Y = CANVAS_HEIGHT * 0.38; // ตำแหน่งหัวโดยเฉลี่ยเมื่อยืนตรง
                const GAIN_X = 1.9, GAIN_Y = 2.2;
                cursorX = Math.max(0, Math.min(CANVAS_WIDTH,
                    CANVAS_WIDTH/2 + (px - CANVAS_WIDTH/2) * GAIN_X));
                cursorY = Math.max(0, Math.min(CANVAS_HEIGHT,
                    CANVAS_HEIGHT/2 + (py - NEUTRAL_Y) * GAIN_Y));
            }

        } else {
            isPersonPresent = false;
        }
    }

    function gameLoop() {
        checkHover();
        drawScene();
        requestAnimationFrame(gameLoop);
    }

    window.onload = function() {
        gameLoop();
    };

    // แปลงพิกัดเมาส์บนหน้าจอจริง ให้เป็นพิกัดภายใน canvas
    function toCanvasCoords(e) {
        const rect = canvas.getBoundingClientRect();
        return {
            x: (e.clientX - rect.left) * (canvas.width / rect.width),
            y: (e.clientY - rect.top) * (canvas.height / rect.height)
        };
    }

    canvas.addEventListener('mousemove', (e) => {
        const p = toCanvasCoords(e);
        cursorX = p.x;
        cursorY = p.y;

        // โหมดเล่นปกติ: เลื่อนเมาส์ซ้าย-ขวาเพื่อบังคับรถเข็น
        if (currentState === STATE_AR_GAME && gameMode === 'NORMAL') {
            cartX = Math.max(CART_HALF_WIDTH, Math.min(CANVAS_WIDTH - CART_HALF_WIDTH, p.x));
        }
    });

    // ปุ่ม "ออกจากภารกิจ" ระหว่างเล่น (ช่วงนี้ไม่ได้ลงทะเบียนปุ่มปกติ จึงเช็กเอง)
    canvas.addEventListener('click', (e) => {
        if (currentState !== STATE_AR_GAME) return;
        const p = toCanvasCoords(e);
        const r = quitBtnRect;
        if (p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h) {
            sfxClick();
            stopMusic();
            currentState = STATE_HATS;
        }
    });

</script>
